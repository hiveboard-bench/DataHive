[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahive-tools"
version = "0.1.5"
description = "Client tooling to collect, validate, annotate and upload HiveBoard manipulation episodes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HiveBoard" }]
keywords = ["robotics", "manipulation", "dataset", "hiveboard", "hdf5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "huggingface_hub>=0.24",
    "h5py>=3.10",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "opencv-python-headless>=4.8"]

[project.urls]
Homepage = "https://github.com/hiveboard-bench/DataHive"
Issues = "https://github.com/hiveboard-bench/DataHive/issues"

[project.scripts]
datahive = "datahive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"datahive" = ["attachments.yaml", "interface/static/*", "interface/static/tasks/*", "skills/*/SKILL.md", "skills/*/reference/*.md"]
