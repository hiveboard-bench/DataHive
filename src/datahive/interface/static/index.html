<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataHive</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><img src="/hiveboard-logo.svg" alt="HiveBoard logo" class="logo">DataHive</h1>
    <div class="toolbar">
      <div class="toolbar-group toolbar-filters">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" type="search" placeholder="Search episode / session / trial…">
        </div>
      </div>
      <div class="toolbar-group toolbar-actions">
        <button id="profileBtn" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
          <span>Robot Profile</span>
        </button>
        <button id="syncBtn" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Sync</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="episode-list-panel">
      <div class="list-filters">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="recorded">recorded</option>
          <option value="validated">validated</option>
          <option value="uploaded">uploaded</option>
          <option value="upload_failed">upload_failed</option>
        </select>
      </div>
      <div id="list" class="episode-list"></div>
    </section>
    <section id="detail" class="episode-detail">
      <p class="empty-hint">Select an episode to see its details.</p>
    </section>
  </main>

  <div id="profileOverlay" class="overlay hidden">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h2>Robot Profile</h2>
        <button id="profileCloseBtn" aria-label="Close">✕</button>
      </div>
      <div id="profileBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
