<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataHive</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  // Applied before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var stored = localStorage.getItem("datahive-theme");
      var theme = (stored === "light" || stored === "dark")
        ? stored
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* localStorage unavailable -- fall back to OS preference via CSS */ }
  })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><img src="/hiveboard-logo.svg" alt="HiveBoard logo" class="logo">DataHive</h1>
    <div class="toolbar">
      <div class="toolbar-group toolbar-filters">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" type="search" placeholder="Search episode / session / trial…">
        </div>
      </div>
      <div class="toolbar-group toolbar-actions">
        <button id="profileBtn" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
          <span>Robot Profile</span>
        </button>
        <button id="syncBtn" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span>Sync</span>
        </button>
        <button id="themeToggleBtn" class="btn-icon icon-only" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="episode-list-panel">
      <div class="list-filters">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="recorded">Recorded</option>
          <option value="validated">Validated</option>
          <option value="uploaded">Uploaded</option>
          <option value="upload_failed">Upload failed</option>
        </select>
      </div>
      <div id="list" class="episode-list"></div>
      <div id="bulkBar" class="bulk-bar">
        <span id="bulkCount">0 selected</span>
        <button id="bulkValidateBtn" class="btn-icon" title="Validate selected" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <span>Validate</span>
        </button>
        <button id="bulkUploadBtn" class="btn-icon" title="Upload selected" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>Upload</span>
        </button>
        <button id="bulkDeleteBtn" class="btn-icon danger" title="Delete selected" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
          <span>Delete</span>
        </button>
        <button id="bulkClearBtn" title="Clear selection" disabled>Clear</button>
      </div>
    </section>
    <section id="detail" class="episode-detail">
      <p class="empty-hint">Select an episode to see its details.</p>
    </section>
  </main>

  <div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

  <div id="profileOverlay" class="overlay hidden">
    <div class="overlay-panel">
      <div class="overlay-header">
        <h2>Robot Profile</h2>
        <button id="profileCloseBtn" aria-label="Close">✕</button>
      </div>
      <div id="profileBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
